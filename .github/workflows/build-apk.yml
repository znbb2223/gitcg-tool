name: Build APK

on:
  workflow_dispatch:
    inputs:
      retention_days:
        description: "APK artifact 保留天数（1-30）"
        required: false
        default: "7"
        type: string

permissions:
  contents: read

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 云端构建 APK
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: 拉取源码
        uses: actions/checkout@v4

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "12.13.0"

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm

      - name: 安装 JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: 安装 Android 打包工具
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq aapt apksigner zipalign unzip zip android-sdk-platform-23
          # android.jar / d8 / build-tools
          if [ -f /usr/lib/android-sdk/platforms/android-23/android.jar ]; then
            echo "ANDROID_SDK=/usr/lib/android-sdk" >> "$GITHUB_ENV"
            echo "ANDROID_PLATFORM=23" >> "$GITHUB_ENV"
          else
            PLAT=$(ls "$ANDROID_HOME/platforms" | sed 's/^android-//' | sort -n | tail -1)
            echo "ANDROID_SDK=$ANDROID_HOME" >> "$GITHUB_ENV"
            echo "ANDROID_PLATFORM=$PLAT" >> "$GITHUB_ENV"
          fi
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* 2>/dev/null | sort -V | tail -1)
          if [ -z "${BT:-}" ] || [ ! -x "$BT/d8" ]; then
            sudo apt-get install -y -qq android-sdk-build-tools
            BT=$(ls -d /usr/lib/android-sdk/build-tools/* 2>/dev/null | sort -V | tail -1)
          fi
          [ -x "$BT/d8" ] || { echo "找不到 d8"; exit 1; }
          echo "BUILD_TOOLS=$BT" >> "$GITHUB_ENV"
          aapt version; java -version

      - name: 缓存素材与数据
        id: cache-assets
        uses: actions/cache@v4
        with:
          path: |
            packages/standalone/public/assets-local
            packages/standalone/public/data
          key: gitcg-assets-7.2.0-v2
          restore-keys: gitcg-assets-

      - name: 下载牌组库数据
        shell: bash
        run: |
          set -euo pipefail
          DATA=packages/standalone/public/data
          if [ ! -f "$DATA/deck-library.json" ]; then
            curl -fL --retry 3 -o /tmp/data.tar.gz \
              "https://github.com/znbb2223/gitcg-tool/releases/download/data-7.2.0/data-7.2.0.tar.gz"
            mkdir -p "$DATA"
            tar -xzf /tmp/data.tar.gz -C packages/standalone/public
          fi
          ls -lh "$DATA"

      - name: 抓取卡图与界面素材
        shell: bash
        run: |
          set -euo pipefail
          ASSETS="$PWD/packages/standalone/public/assets-local"
          mkdir -p "$ASSETS"
          collect() {
            (
              cd packages/standalone
              node scripts/download-assets.mjs || true
              node scripts/download-datum.mjs || true
              node scripts/download-cardface.mjs || true
              timeout 1800 node scripts/download-full.mjs || true
            )
          }
          check() {
            n=$(find "$ASSETS" -type f | wc -l)
            faces=$(find "$ASSETS" -path '*/cardFace/full.webp' | wc -l)
            ui=$(find "$ASSETS/ui" -type f 2>/dev/null | wc -l)
            datum=$(find "$ASSETS/api/v5/datum" -name '*.json' 2>/dev/null | wc -l)
            echo "素材：总 $n / 卡面 $faces / UI $ui / datum $datum"
            [ "$n" -ge 14000 ] && [ "$faces" -ge 800 ] && [ "$ui" -ge 100 ] && [ "$datum" -ge 4000 ]
          }
          if ! check; then
            collect
            if ! check; then
              echo "首次抓取不完整，重试一轮（补齐失败项）"
              collect
              check || { echo "素材仍不完整，终止"; exit 1; }
            fi
          fi
          echo "素材校验通过"

      - name: 构建 Web + 打包 APK
        shell: bash
        env:
          PUPPETEER_SKIP_DOWNLOAD: "1"
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: |
          set -euo pipefail
          pnpm install --config.package-import-method=copy
          sh build-oneclick.sh --skip-fetch --out "$PWD/out"

      - name: 校验与校验和
        shell: bash
        run: |
          set -euo pipefail
          APK=$(ls out/*.apk | head -1)
          SIZE=$(du -h "$APK" | cut -f1)
          SHA=$(sha256sum "$APK" | tee out/SHA256SUMS.txt | cut -d' ' -f1)
          echo "APK: $APK ($SIZE) SHA256=$SHA"
          {
            echo "### 构建完成"
            echo "- 文件：\`$(basename "$APK")\`"
            echo "- 体积：$SIZE"
            echo "- SHA256：\`$SHA\`"
            echo "- 提示：CI 用临时签名，不能覆盖安装旧版；要覆盖请用自己的 keystore。"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 上传 APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: gitcg-apk-${{ github.run_number }}
          path: |
            out/*.apk
            out/SHA256SUMS.txt
          retention-days: ${{ fromJSON(inputs.retention_days || '7') }}
