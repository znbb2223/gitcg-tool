<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="stylesheet" href="/responsive.css" />
    <title>组牌器 · 七圣召唤工具</title>
    <script>
      window.__STATIC_DATA_BASE__ = "/assets-local";
      window.__UI_ASSET_BASE__ = "/assets-local/ui/";
      window.__LOCAL_ASSETS__ = true;
    </script>
  
    <style id="app-feel">
      /* 去掉浏览器痕迹：点击蓝色高亮、文本选中、长按菜单、滚动条 */
      * { -webkit-tap-highlight-color: transparent !important; }
      html, body { overscroll-behavior: none; }
      body { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
      button, a, select, input, textarea { -webkit-appearance: none; appearance: none; outline: none !important; }
      ::selection { background: transparent; }
      ::-webkit-scrollbar { width: 0; height: 0; }
    </style>
    <link rel="stylesheet" href="/genshin-ui.css" />

  </head>
  <body>
        <script>
      // 跟随「主体方向」设置（模拟器对局除外），进页立即应用
      setTimeout(() => {
        if (localStorage.getItem("gitcg.mainOrientation") === "landscape") {
          window.AndroidHost?.setOrientation?.("landscape");
        }
      }, 300);
    </script>
<div id="root"></div>
    <script type="module" src="/src/deckbuilder.tsx"></script>
  </body>
</html>
