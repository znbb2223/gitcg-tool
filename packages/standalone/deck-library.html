<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="stylesheet" href="/responsive.css" />
    <title>七圣召唤工具 · 牌组库</title>
    <style>
      :root {
        color-scheme: dark;
        --gold: #e3c27e;
        --gold-dim: rgba(227, 194, 126, 0.32);
        --ink: #f2ead9;
        --muted: #93a3b3;
        --panel: linear-gradient(160deg, rgba(38, 54, 70, 0.92), rgba(15, 23, 32, 0.94));
        --line: rgba(227, 194, 126, 0.18);
      }
      * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
      html { min-height: 100%; }
      body {
        margin: 0;
        padding: 14px 12px 30px;
        min-height: 100%;
        color: var(--ink);
        font-family: system-ui, -apple-system, "Helvetica Neue", "Noto Sans SC", sans-serif;
        background:
          linear-gradient(180deg, rgba(8, 14, 21, 0.86), rgba(6, 10, 16, 0.94)),
          url("/assets-local/ui/ChessboardBackground.webp") center / cover no-repeat,
          linear-gradient(180deg, #16222e, #0a1119 72%);
        background-blend-mode: normal, luminosity, normal;
        background-attachment: fixed, fixed, fixed;
      }
      body.locked { overflow: hidden; }

      /* 顶部固定区：标题/搜索/筛选/计数不随列表滚动 */
      .libhead {
        position: sticky;
        top: 0;
        z-index: 25;
        margin: -14px -12px 12px;
        padding: 12px 12px 10px;
        background: linear-gradient(180deg, rgba(26, 21, 14, 0.98), rgba(20, 15, 10, 0.96));
        border-bottom: 1px solid var(--line);
        box-shadow: 0 8px 18px rgba(0, 0, 0, 0.35);
        backdrop-filter: blur(8px);
      }
      .quicknav {
        display: flex;
        gap: 8px;
        margin-left: auto;
        flex: 0 0 auto;
      }
      .quicknav button {
        width: 34px;
        height: 34px;
        padding: 0;
        border-radius: 50%;
        border: 1px solid rgba(227, 194, 126, 0.45);
        background: rgba(227, 194, 126, 0.1);
        color: #f0dcaa;
        font-size: 15px;
        line-height: 1;
      }
      .quicknav button:active { transform: scale(0.94); }
      .filterline { display: flex; align-items: center; gap: 10px; margin: 6px 0 2px; }
      .filterline .activechips { flex: 1 1 auto; margin: 0; }
      .resultline { margin-top: 4px; }

      /* 顶部 */
      .top { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
      h1 {
        margin: 0;
        font-size: 21px;
        font-weight: 600;
        letter-spacing: 0.22em;
        color: #f6ecd6;
        text-shadow: 0 0 20px rgba(227, 194, 126, 0.25);
      }
      .stats { margin-top: 5px; font-size: 11.5px; color: var(--muted); line-height: 1.6; }
      .home {
        flex: 0 0 auto;
        display: grid;
        place-items: center;
        min-height: 40px;
        padding: 0 13px;
        border: 1px solid var(--gold-dim);
        border-radius: 4px;
        background: rgba(227, 194, 126, 0.06);
        color: #e9dcc0;
        font-size: 12px;
        text-decoration: none;
      }
      .home:active { background: rgba(227, 194, 126, 0.16); }

      /* 筛选区 */
      .filters { margin-top: 14px; }
      .scrollrow {
        display: flex;
        flex-wrap: nowrap;
        gap: 6px;
        overflow-x: auto;
        overflow-y: hidden;
        margin: 0 -12px;
        padding: 0 12px;
        scrollbar-width: none;
      }
      .scrollrow::-webkit-scrollbar { display: none; }
      .scrollrow > * { flex: 0 0 auto; }
      .filters > * + * { margin-top: 8px; }
      .seg {
        min-height: 40px;
        padding: 0 12px;
        border-radius: 4px;
        border: 1px solid rgba(255, 255, 255, 0.1);
        background: rgba(255, 255, 255, 0.04);
        color: #c8d2dc;
        font: inherit;
        font-size: 12.5px;
        white-space: nowrap;
        cursor: pointer;
      }
      .seg.on {
        color: #1b1409;
        font-weight: 600;
        border-color: transparent;
        background: linear-gradient(180deg, #e8cd92, #c9a660);
      }
      .ctlrow { display: flex; gap: 8px; align-items: stretch; }
      .ctlrow > input { flex: 1 1 auto; min-width: 0; }
      .ctlrow > select { flex: 0 0 auto; max-width: 40%; }
      input[type="search"], select {
        min-height: 44px;
        padding: 0 10px;
        border-radius: 4px;
        border: 1px solid rgba(255, 255, 255, 0.12);
        background: rgba(10, 18, 26, 0.72);
        color: var(--ink);
        font: inherit;
        font-size: 13px;
      }
      input[type="search"]::placeholder { color: #94866c; }
      select { color: #e5d6b0; padding-right: 8px; }
      .resultline { font-size: 11.5px; color: var(--muted); padding-top: 2px; }

      /* 列表 */
      .grid {
        margin-top: 12px;
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
      }
      @media (min-width: 620px) {
        .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
      }
      .deck {
        position: relative;
        display: flex;
        flex-direction: column;
        gap: 6px;
        padding: 9px 9px 10px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: var(--panel);
        color: var(--ink);
        font: inherit;
        text-align: left;
        cursor: pointer;
      }
      .deck::after {
        content: "";
        position: absolute;
        inset: 3px;
        border: 1px solid rgba(227, 194, 126, 0.08);
        border-radius: 4px;
        pointer-events: none;
      }
      .deck:active { transform: scale(0.992); }
      .avs { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 5px; }
      .av {
        position: relative;
        display: block;
        aspect-ratio: 1 / 1;
        overflow: hidden;
        border-radius: 5px;
        background: #2b343d;
        border: 1px solid rgba(255, 255, 255, 0.08);
      }
      .av img { display: block; width: 100%; height: 100%; object-fit: cover; }
      .av .avname {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        padding: 3px 2px 2px;
        font-size: 9.5px;
        font-style: normal;
        font-weight: 400;
        text-align: center;
        color: #f0e7d6;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        background: linear-gradient(180deg, transparent, rgba(4, 8, 12, 0.82));
      }
      .brow { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
      .style {
        font-size: 10px;
        padding: 1px 6px;
        border-radius: 999px;
        border: 1px solid currentColor;
        line-height: 1.6;
      }
      .style-aggro { color: #e0976a; }
      .style-midrange { color: #7aa8cc; }
      .style-control { color: #a99ae0; }
      .style-combo { color: #d98fa8; }
      .pop { font-size: 10px; color: #7f8f9e; }
      .bar {
        display: block;
        height: 4px;
        border-radius: 2px;
        background: rgba(255, 255, 255, 0.09);
        overflow: hidden;
      }
      .bar > i { display: block; height: 100%; border-radius: 2px; background: #c8a15a; }
      .bar > i.win-good { background: #7fb286; }
      .bar > i.win-bad { background: #bf7f6d; }
      .wline { display: block; font-size: 11px; color: #ddd2bc; }
      .tags { display: flex; flex-wrap: wrap; gap: 4px; }
      .tags > span {
        font-size: 9.5px;
        padding: 1px 5px;
        border-radius: 3px;
        color: #9fc0dd;
        background: rgba(120, 160, 200, 0.12);
        border: 1px solid rgba(120, 160, 200, 0.18);
      }
      .cs {
        display: block;
        font-size: 10px;
        color: #93a3b3;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .cs b { color: #d6bd85; font-weight: 500; }
      .cs.nowin { color: #94866c; }
      .muted { color: #94866c; font-size: 11px; }
      .empty {
        grid-column: 1 / -1;
        padding: 26px 10px;
        text-align: center;
        font-size: 12.5px;
        color: var(--muted);
        line-height: 1.9;
      }
      .retry {
        margin-top: 10px;
        min-height: 40px;
        padding: 0 16px;
        border-radius: 4px;
        border: 1px solid var(--gold-dim);
        background: rgba(227, 194, 126, 0.1);
        color: #e9dcc0;
        font: inherit;
        font-size: 12.5px;
      }
      #more {
        display: block;
        width: 100%;
        margin-top: 12px;
        min-height: 44px;
        border-radius: 4px;
        border: 1px solid var(--gold-dim);
        background: rgba(227, 194, 126, 0.07);
        color: #e9dcc0;
        font: inherit;
        font-size: 12.5px;
      }
      #more[hidden] { display: none; }

      /* 详情面板 */
      #detail {
        position: fixed;
        inset: 0;
        z-index: 20;
        overflow: hidden;
        -webkit-overflow-scrolling: touch;
        visibility: hidden;
        transform: translateY(100%);
        transition: transform 220ms ease, visibility 220ms;
        background:
          radial-gradient(120% 60% at 50% 0%, rgba(38, 54, 70, 0.75), transparent 70%),
          linear-gradient(180deg, #0b131c, #070c12 70%);
      }
      #detail.open { visibility: visible; transform: none; }
      #detailBody {
        display: flex;
        flex-direction: column;
        height: 100%;
        min-height: 0;
        padding: 0;
      }
      .dtop {
        position: relative;
        flex: none;
        z-index: 2;
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px 16px;
        background: linear-gradient(180deg, #0b131c 76%, rgba(11, 19, 28, 0));
      }
      .close {
        flex: 0 0 auto;
        width: 40px;
        height: 40px;
        border-radius: 4px;
        border: 1px solid var(--gold-dim);
        background: rgba(227, 194, 126, 0.08);
        color: #e9dcc0;
        font: inherit;
        font-size: 16px;
        line-height: 1;
      }
      .dtitle { font-size: 15px; font-weight: 600; color: #f4e9d2; letter-spacing: 0.04em; }
      .dsub { margin-top: 4px; font-size: 11px; color: var(--muted); }
      section { margin-top: 18px; }
      h2 {
        margin: 0 0 8px;
        font-size: 12.5px;
        font-weight: 600;
        letter-spacing: 0.16em;
        color: var(--gold);
        display: flex;
        align-items: center;
        gap: 8px;
      }
      h2::after {
        content: "";
        flex: 1 1 auto;
        height: 1px;
        background: linear-gradient(90deg, var(--gold-dim), transparent);
      }
      .bigchars { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
      .bigchars figure { margin: 0; }
      .art {
        aspect-ratio: 3 / 4;
        overflow: hidden;
        border-radius: 6px;
        border: 1px solid var(--line);
        background: #232c36;
      }
      .art img { display: block; width: 100%; height: 100%; object-fit: cover; object-position: top center; }
      figcaption { margin-top: 5px; font-size: 11px; text-align: center; color: #e8dcc2; }
      .cardchips { display: flex; flex-wrap: wrap; gap: 6px; }
      .cc {
        font-size: 11.5px;
        line-height: 1.5;
        padding: 5px 8px;
        border-radius: 4px;
        border: 1px solid rgba(255, 255, 255, 0.09);
        background: rgba(255, 255, 255, 0.045);
        color: #dfe6ee;
      }
      .cc b { margin-left: 4px; color: var(--gold); font-weight: 600; }
      .fold {
        margin-top: 8px;
        min-height: 40px;
        width: 100%;
        border-radius: 4px;
        border: 1px solid rgba(255, 255, 255, 0.12);
        background: rgba(255, 255, 255, 0.04);
        color: #c8d2dc;
        font: inherit;
        font-size: 12px;
      }
      .fold[hidden] { display: none; }
      .guide h3 {
        margin: 0 0 4px;
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0.1em;
        color: #e2cf9f;
      }
      .guide p { margin: 0 0 12px; font-size: 13px; line-height: 1.78; color: #d3dce4; }
      .aibadge {
        flex: 0 0 auto;
        font-style: normal;
        font-size: 9.5px;
        font-weight: 600;
        letter-spacing: 0.06em;
        padding: 2px 6px;
        border-radius: 3px;
        color: #0d151d;
        background: linear-gradient(180deg, #e6cf9b, #c9a86b);
      }
      .ainote {
        margin: -2px 0 12px !important;
        font-size: 11.5px !important;
        color: var(--muted) !important;
        line-height: 1.6 !important;
      }
      .guide p:last-child { margin-bottom: 0; }
      .bigbar { height: 6px; border-radius: 3px; background: rgba(255, 255, 255, 0.09); overflow: hidden; }
      .bigbar > i { display: block; height: 100%; background: linear-gradient(90deg, #b08d4f, #e8cd92); }
      .wmeta { margin-top: 6px; font-size: 12px; color: #ddd2bc; }
      .authorline {
        display: flex;
        flex-wrap: wrap;
        align-items: baseline;
        gap: 8px;
        margin-bottom: 8px;
      }
      .authorname { font-size: 13px; font-weight: 600; color: #f0dfb8; }
      .authoruid, .authorwhen { font-size: 11px; color: var(--muted); }
      .authoruid {
        padding: 2px 7px;
        border-radius: 4px;
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid rgba(255, 255, 255, 0.08);
        font-variant-numeric: tabular-nums;
      }
      .authornote {
        margin: 0;
        font-size: 12.5px;
        line-height: 1.75;
        color: #d6dde5;
        white-space: pre-wrap;
        word-break: break-word;
      }
      .authornote.empty { color: var(--muted); font-style: normal; }
      .author { font-size: 10.5px; color: #8fa3b5; }
      .deck .role {
        align-self: flex-start;
        padding: 1px 7px;
        border-radius: 4px;
        border: 1px solid rgba(227, 194, 126, 0.35);
        background: rgba(227, 194, 126, 0.1);
        color: #e7d3a8;
        font-size: 10px;
      }
      .droletag {
        margin-left: 6px;
        padding: 1px 7px;
        border-radius: 4px;
        border: 1px solid rgba(227, 194, 126, 0.4);
        background: rgba(227, 194, 126, 0.12);
        color: #f0ddb6;
        font-size: 10.5px;
        font-weight: 500;
      }
      .atags { display: flex; flex-wrap: wrap; gap: 5px; margin: 2px 0 8px; }
      .atag {
        padding: 2px 8px;
        border-radius: 999px;
        border: 1px solid rgba(140, 200, 255, 0.28);
        background: rgba(140, 200, 255, 0.09);
        color: #cfe4f7;
        font-size: 10.5px;
      }
      .srcbadge {
        flex: 0 0 auto;
        font-style: normal;
        font-size: 9.5px;
        padding: 2px 6px;
        border-radius: 3px;
        border: 1px solid rgba(140, 200, 255, 0.32);
        color: #a8cbe8;
      }
      .dchars { margin-top: 4px; font-size: 11.5px; color: #b9c6d2; }

      /* 顶栏分页 */
      .dtabs {
        flex: none;
        display: flex;
        gap: 6px;
        padding: 4px 16px 10px;
      }
      .dtab {
        flex: 1 1 0;
        min-width: 0;
        min-height: 38px;
        padding: 0 6px;
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 5px;
        background: rgba(255, 255, 255, 0.04);
        color: #c3cfda;
        font: inherit;
        font-size: 12px;
        line-height: 1.2;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .dtab.on {
        color: #17110a;
        font-weight: 600;
        border-color: #c9a660;
        background: linear-gradient(180deg, #e8cd92, #c9a660);
      }

      /* 可滚动内容区 */
      .dbody {
        flex: 1 1 auto;
        min-height: 0;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
        padding: 0 16px 14px;
      }
      .dbody .dpane { margin-top: 0; }
      .dbody .dpane[hidden] { display: none; }
      .dbody .dpane h2.mt { margin-top: 18px; }

      /* 固定底部：对战数据 + 分享码（沿用旧样式） */
      .dfoot {
        flex: none;
        max-height: 56vh;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
        border-top: 1px solid var(--line);
        padding: 10px 16px 8px;
        background: linear-gradient(180deg, rgba(8, 13, 19, 0.94), rgba(6, 11, 17, 0.99));
      }
      .dfold {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        width: 100%;
        min-height: 34px;
        margin: 0;
        padding: 0 10px;
        border: 0;
        border-radius: 0;
        background: transparent;
        color: #9fb0c1;
        font: inherit;
        font-size: 11.5px;
        letter-spacing: 0.02em;
      }
      .dfold-icon {
        font-style: normal;
        font-size: 1.35em;
        line-height: 1;
        color: var(--gold);
        transition: transform 160ms ease;
      }
      .dfoot.folded .dfold { min-height: 30px; }
      .dfoot.folded .dfinner { display: none; }
      .dfoot.folded {
        max-height: none;
        overflow: hidden;
        padding: 2px 0 calc(2px + env(safe-area-inset-bottom));
      }
      .dfoot .dfinner { padding-bottom: calc(6px + env(safe-area-inset-bottom)); }
      .dfoot section { margin-top: 0; }
      .dfoot section + section { margin-top: 16px; }
      .dfoot h2 { margin-bottom: 6px; }
      .dfoot .subhead { margin-top: 10px; }
      .dfoot .codebox { padding: 8px 10px; font-size: 11px; line-height: 1.6; word-break: break-all; }
      .dfoot .copy { margin-top: 8px; }
      .dfoot .shareBtn { margin-top: 8px; }

        display: flex;
        flex-wrap: wrap;
        align-items: baseline;
        gap: 8px;
        margin-bottom: 8px;
      }

      }

      .deck .title {
        font-size: 12px;
        line-height: 1.45;
        color: #eddfc2;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }
      .chips { display: flex; flex-wrap: wrap; gap: 6px; }
      .chip {
        min-height: 40px;
        max-width: 100%;
        padding: 0 10px;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        border-radius: 4px;
        border: 1px solid var(--line);
        background: rgba(227, 194, 126, 0.07);
        color: #e5dcc8;
        font: inherit;
        font-size: 11.5px;
        text-align: left;
      }
      .chip:active { background: rgba(227, 194, 126, 0.18); }
      .chip b { color: var(--gold); font-weight: 600; }
      .subhead {
        margin: 12px 0 6px;
        font-size: 11.5px;
        color: var(--muted);
        letter-spacing: 0.06em;
      }
      .codebox {
        padding: 10px;
        border-radius: 4px;
        border: 1px solid rgba(255, 255, 255, 0.1);
        background: rgba(8, 14, 21, 0.8);
        color: #ddd2bc;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 11.5px;
        line-height: 1.7;
        word-break: break-all;
        user-select: text;
        -webkit-user-select: text;
        max-height: 92px;
        overflow-y: auto;
      }
      .copy {
        margin-top: 10px;
        width: 100%;
        min-height: 44px;
        border: 1px solid transparent;
        border-radius: 4px;
        background: linear-gradient(180deg, #e8cd92, #c9a660);
        color: #1b1409;
        font: inherit;
        font-size: 15px;
        font-weight: 600;
