<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>七圣召唤 · 牌组码编辑器</title>
<style>
  :root { --bg:#151b25; --panel:#1d2634; --panel2:#232e3f; --line:#2f3a4c; --ink:#ece6d8; --muted:#93a0b4; --gold:#e0c489; --teal:#7fc9c1; --red:#ff8a80; }
  * { box-sizing: border-box; }
  body { margin:0; background:radial-gradient(1200px 500px at 15% -10%, #243349 0%, var(--bg) 60%); color:var(--ink);
         font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif; padding:16px 14px 40px; }
  .wrap { max-width:980px; margin:0 auto; }
  h1 { font-size:19px; margin:0 0 4px; color:var(--gold); }
  .sub { color:var(--muted); font-size:12.5px; line-height:1.6; margin-bottom:12px; }
  .panel { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:12px; margin-bottom:12px; }
  textarea { width:100%; min-height:70px; background:var(--panel2); color:var(--ink); border:1px solid var(--line);
             border-radius:9px; padding:10px; font-size:14px; line-height:1.5; resize:vertical; }
  .row { display:flex; flex-wrap:wrap; gap:7px; margin-top:8px; }
  button { background:#26334a; color:var(--ink); border:1px solid var(--line); border-radius:8px; padding:8px 12px; font-size:13.5px; cursor:pointer; }
  button:hover { border-color:var(--gold); color:var(--gold); }
  button.primary { background:#2d3c55; border-color:var(--gold); color:var(--gold); }
  .slots { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
  .slot { position:relative; background:var(--panel2); border:1px solid var(--line); border-radius:9px; padding:7px 8px 6px; }
  .slot.char { border-color:#4b5d3f; }
  .slot .no { color:var(--muted); font-size:10.5px; letter-spacing:.5px; }
  .slot input { width:100%; background:transparent; border:0; outline:none; color:var(--ink); font-size:14px; padding:2px 0; }
  .slot input::placeholder { color:#5c687c; }
  .slot .id { color:var(--teal); font-size:10.5px; min-height:13px; }
  .slot.bad { border-color:var(--red); }
  .slot.bad .id { color:var(--red); }
  #out { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:10px 12px;
         font-family:ui-monospace,Menlo,Consolas,monospace; font-size:13.5px; word-break:break-all; min-height:60px; white-space:pre-wrap; }
  #out .code { color:#9ad0ff; } #out .ok { color:var(--gold); } #out .err { color:var(--red); }
  .hint { color:var(--muted); font-size:12px; line-height:1.7; margin-top:8px; }
  details { margin-top:6px; } summary { cursor:pointer; color:var(--gold); font-size:14px; }
  #search { width:100%; margin-top:8px; background:var(--panel2); color:var(--ink); border:1px solid var(--line);
            border-radius:8px; padding:8px 10px; font-size:14px; }
  #table { max-height:260px; overflow:auto; margin-top:8px; border:1px solid var(--line); border-radius:8px; }
  #table table { width:100%; border-collapse:collapse; font-size:12.5px; }
  #table td { padding:5px 8px; border-bottom:1px solid #26303f; }
  #table tr { cursor:pointer; } #table tr:hover { background:#25324a; }
  #table .k { color:var(--muted); } #table .n { color:var(--ink); } #table .i { color:var(--teal); font-family:monospace; }
</style>
</head>
<body>
<div class="wrap">
  <h1>七圣召唤 · 牌组码编辑器</h1>
  <div class="sub">33 个槽位可自由编辑（姓名或 ID 均可）；内置 110 角色 / 527 行动牌的对照表。纯本地运行，不联网。</div>

  <div class="panel">
    <b style="font-size:13px;color:var(--muted)">批量输入</b>
    <textarea id="bulk" placeholder="粘贴 33 个名字/ID（3 角色 + 30 行动牌），或贴牌组码后点「解码填充」&#10;例：甘雨 迪奥娜 凯亚 唯此一心 猫爪冰摇 ..."></textarea>
    <div class="row">
      <button class="primary" onclick="fillBulk(33)">填充全部 33 槽</button>
      <button onclick="fillBulk(30)">只填充行动牌 30 槽</button>
      <button onclick="decodeBulk()">解码填充</button>
      <button onclick="copyCode()">复制牌组码</button>
      <button onclick="clearAll()">清空</button>
    </div>
  </div>

  <div class="panel">
    <b style="font-size:13px;color:var(--muted)">角色（3）</b>
    <div class="slots" id="chars"></div>
  </div>

  <div class="panel">
    <b style="font-size:13px;color:var(--muted)">行动牌（30）</b>
    <div class="slots" id="cards"></div>
  </div>

  <div class="panel">
    <div id="out">等待输入…</div>
    <div class="hint">
      点一个槽位后再点下方对照表条目，可把该卡填进槽位；不选槽位时默认填进第一个空行动牌位。
      非常手段（30 张同卡 / 3 个同角色）仅用于测试，正式对局可能被拒绝。
    </div>
  </div>

  <div class="panel">
    <details>
      <summary>名字 ↔ 数字 ID 对照表（点击填入槽位）</summary>
      <input id="search" placeholder="输入名字或 ID 过滤，如：甘雨 / 211011" oninput="renderTable()" />
      <div id="table"></div>
    </details>
  </div>
</div>

  return encodeRaw(ids.map((id) => {
    const row = BY_ID.get(id);
    if (!row) throw new Error(`未知卡牌 id：${id}`);
    return row.sid;
  }));
}

function decodeDeck(code) {
  return decodeRaw(code).map((sid) => {
    if (!SHARE.has(sid)) throw new Error(`未知 share id ${sid}`);
    return SHARE.get(sid);
  });
}

function resolve(token) {
  token = String(token).trim().replace(/^["']|["']$/g, "");
  if (!token) return null;
  if (/^\d+$/.test(token)) {
    const id = Number(token);
    if (!BY_ID.has(id)) throw new Error(`未知卡牌 id：${id}`);
    return id;
  }
  const exact = TABLE.filter(([, name]) => name === token);
  if (exact.length === 1) return exact[0][0];
  const subs = TABLE.filter(([, name]) => name.includes(token));
  if (subs.length === 1) return subs[0][0];
  if (!subs.length) throw new Error(`找不到名字包含「${token}」的卡牌`);
  throw new Error(`「${token}」匹配到多个：` + subs.slice(0, 6).map(([id, name]) => `${name}(${id})`).join("、"));
}

const slots = Array(33).fill(null);
let focusIndex = -1;
const $ = (sel) => document.querySelector(sel);
const out = $("#out");

function slotInput(i) { return document.querySelector(`.slot[data-i="${i}"] input`); }

function buildSlots() {
  $("#namelist").innerHTML = TABLE.map(([id, name]) => `<option value="${name}">${name} (${id})</option>`).join("");
  for (const [container, from, to, cls] of [["#chars", 0, 3, "char"], ["#cards", 3, 33, ""]]) {
    const wrap = $(container);
    for (let i = from; i < to; i++) {
      const div = document.createElement("div");
      div.className = "slot " + cls;
      div.dataset.i = i;
      div.innerHTML = `<div class="no">${i < 3 ? "角色" : "行动牌"} ${i < 3 ? i + 1 : i - 2}</div>
        <input list="namelist" placeholder="${i < 3 ? "角色名或 ID" : "牌名或 ID"}" />
        <div class="id"></div>`;
      const input = div.querySelector("input");
      input.addEventListener("focus", () => { focusIndex = i; });
      input.addEventListener("change", () => { applyInput(i, input.value); });
      wrap.appendChild(div);
    }
  }
  syncSlots();
}

function applyInput(i, text) {
  const div = document.querySelector(`.slot[data-i="${i}"]`);
  try {
    const id = resolve(text);
    if (id === null) { slots[i] = null; div.classList.remove("bad"); div.querySelector(".id").textContent = ""; }
    else {
      slots[i] = id;
      div.classList.remove("bad");
      div.querySelector(".id").textContent = `#${id}`;
      inputValue(i, BY_ID.get(id).name);
    }
  } catch (e) {
    slots[i] = null;
    div.classList.add("bad");
    div.querySelector(".id").textContent = e.message;
  }
  render();
}

function inputValue(i, text) {
  const input = slotInput(i);
  if (input && input.value !== text) input.value = text;
}

function syncSlots() {
  for (let i = 0; i < 33; i++) {
    const div = document.querySelector(`.slot[data-i="${i}"]`);
    const id = slots[i];
    div.classList.remove("bad");
    div.querySelector("input").value = id ? BY_ID.get(id).name : "";
    div.querySelector(".id").textContent = id ? `#${id}` : "";
  }
}

function render() {
  const countChar = slots.slice(0, 3).filter(Boolean).length;
  const countCard = slots.slice(3).filter(Boolean).length;
  if (countChar !== 3 || countCard !== 30) {
    const empty = slots.map((v, i) => (v ? null : i + 1)).filter(Boolean);
    out.innerHTML = `<span class="err">还差 ${empty.length} 个槽位（缺：${empty.join(", ")}）</span>\n角色 ${countChar}/3 · 行动牌 ${countCard}/30`;
    return;
  }
  try {
    const code = encodeDeck(slots);
    out.innerHTML = `<span class="ok">牌组码：</span><span class="code">${code}</span>\n角色 ${countChar}/3 · 行动牌 ${countCard}/30`;
  } catch (e) { out.innerHTML = `<span class="err">错误：${e.message}</span>`; }
}

function parseTokens(text) {
  return text.split(/[\s,，、]+/).filter(Boolean);
}

function fillBulk(count) {
  try {
    const ids = parseTokens($("#bulk").value).map((t) => {
      const id = resolve(t);
      if (id === null) throw new Error(`空输入「${t}」`);
      return id;
    });
    if (ids.length === 33) {
      ids.forEach((id, i) => { slots[i] = id; });
    } else if (ids.length === 30 || count === 30) {
      if (ids.length !== 30) throw new Error(`只填充行动牌需要 30 个，现在 ${ids.length} 个`);
      ids.forEach((id, i) => { slots[i + 3] = id; });
    } else {
      throw new Error(`需要 33 个（3 角色 + 30 牌），现在 ${ids.length} 个`);
    }
    syncSlots(); render();
  } catch (e) { out.innerHTML = `<span class="err">错误：${e.message}</span>`; }
}

function decodeBulk() {
  try {
    const pos = parseTokens($("#bulk").value).findIndex((t) => t.length > 40);
    const code = pos >= 0 ? parseTokens($("#bulk").value)[pos] : $("#bulk").value.trim();
    const ids = decodeDeck(code);
    ids.forEach((id, i) => { slots[i] = id; });
    syncSlots(); render();
  } catch (e) { out.innerHTML = `<span class="err">错误：${e.message}</span>`; }
}

function clearAll() {
  for (let i = 0; i < 33; i++) slots[i] = null;
  syncSlots(); render();
}

function copyCode() {
  const text = out.innerText;
  navigator.clipboard?.writeText(text).then(() => {
    out.innerHTML = `<span class="ok">已复制（${text.split("\n")[0]}）</span>`;
    setTimeout(render, 1200);
  }, () => { out.innerHTML = `<span class="err">复制失败，请手动选择</span>`; });
}

function renderTable() {
  const kw = $("#search").value.trim();
  const hits = TABLE.filter(([id, name]) => !kw || name.includes(kw) || String(id) === kw).slice(0, 120);
  $("#table").innerHTML = `<table>${hits.map(([id, name, kind, sid]) =>
    `<tr data-id="${id}"><td class="k">${kind}</td><td class="n">${name}</td><td class="i">${id}</td><td class="k">shareId ${sid}</td></tr>`).join("")}</table>`;
  for (const tr of $("#table").querySelectorAll("tr")) {
    tr.onclick = () => {
      const id = Number(tr.dataset.id);
      let target = focusIndex;
      if (target < 0) target = slots.findIndex((v, i) => i >= 3 && !v);
      if (target < 0) target = 3;
      slots[target] = id;
      focusIndex = -1;
      syncSlots(); render();
    };
  }
}

buildSlots();
renderTable();
render();
</script>
</body>
</html>
