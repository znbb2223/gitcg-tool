<title>七圣召唤 · 牌组码工具</title>
<style>
  :root { --bg:#141a24; --panel:#1c2532; --ink:#ece6d8; --muted:#93a0b4; --gold:#e0c489; --line:#2c3646; }
  * { box-sizing: border-box; }
  body { margin:0; padding:18px; background:radial-gradient(1200px 600px at 20% -10%, #223047 0%, var(--bg) 60%); color:var(--ink);
         font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif; }
  h1 { font-size:20px; margin:0 0 4px; color:var(--gold); letter-spacing:.5px; }
  .sub { color:var(--muted); font-size:13px; margin-bottom:16px; }
  .wrap { max-width:900px; margin:0 auto; }
  textarea { width:100%; min-height:110px; resize:vertical; background:var(--panel); color:var(--ink);
             border:1px solid var(--line); border-radius:10px; padding:12px; font-size:15px; line-height:1.5; }
  .row { display:flex; flex-wrap:wrap; gap:8px; margin:10px 0; }
  button { background:#243044; color:var(--ink); border:1px solid var(--line); border-radius:9px;
           padding:9px 14px; font-size:14px; cursor:pointer; }
  button:hover { border-color:var(--gold); color:var(--gold); }
  button.primary { background:#2c3a52; border-color:var(--gold); color:var(--gold); }
  .out { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:12px;
         font-family:ui-monospace, Menlo, Consolas, monospace; font-size:14px; white-space:pre-wrap; word-break:break-all; min-height:80px; }
  .ok { color:var(--gold); } .err { color:#ff8a80; }
  .hint { color:var(--muted); font-size:12px; line-height:1.7; margin-top:12px; }
  .code { color:#9ad0ff; }
</style>

<body>
<div class="wrap">
  <h1>七圣召唤 · 牌组码工具</h1>
  <div class="sub">编码 / 解码 / 非常手段牌组码（30 张同卡、3 个同角色、重复模式）。纯本地运行，不联网。</div>

  <textarea id="input" placeholder="粘贴牌组码，或输入 33 个卡牌 id（空格/逗号分隔）&#10;例：1314 1601 1208 332001 ...（共 33 个）"></textarea>
  <div class="row">
    <button class="primary" onclick="doAuto()">自动（编码/解码）</button>
    <button onclick="doEncode()">编码</button>
    <button onclick="doDecode()">解码</button>
    <button onclick="doSameCard()">30 张同卡</button>
    <button onclick="doSameChar()">3 个同角色</button>
    <button onclick="doRepeat()">重复模式</button>
    <button onclick="copyOut()">复制结果</button>
  </div>
  <div class="out" id="out">等待输入…</div>
  <div class="hint">
    · <b>编码</b>：输入 33 个 id（前 3 个是角色，后 30 张是行动牌）。<br />
    · <b>30 张同卡</b>：输入 4 个数 <code>行动牌id 角色1 角色2 角色3</code>。<br />
    · <b>3 个同角色</b>：输入 2 个数 <code>角色id 行动牌id</code>。<br />
    · <b>重复模式</b>：输入 <code>角色1 角色2 角色3 牌1 牌2 …</code>，循环补到 30 张。<br />
    · 非常手段牌组码仅用于测试/娱乐，正式对局可能被规则或服务端拒绝；牌组码对顺序敏感。
  </div>
</div>
<script>

:330011,"488":332046,"489":331806,"490":332048,"491":333028,"492":1512,"493":1513,"494":2704,"495":215121,"496":215131,"497":227041,"498":312035,"499":312036,"500":321029,"501":321030,"502":322029,"503":322030,"504":332049,"505":332050,"506":1414,"507":1514,"508":2305,"509":214141,"510":215141,"511":223051,"512":312037,"513":312038,"514":312039,"515":332051,"516":332052,"517":332053,"518":332054,"519":332055,"520":311208,"521":1415,"522":1515,"523":2206,"524":214151,"525":215151,"526":222061,"527":311111,"528":312040,"529":312041,"530":321031,"531":332056,"532":333029,"533":1115,"534":1316,"535":2604,"536":211151,"537":213161,"538":226041,"539":312043,"540":322031,"541":330012,"542":332057,"543":332058,"544":1116,"545":1416,"546":2207,"547":211161,"548":214161,"549":222071,"550":311112,"551":311310,"552":312044,"553":322032,"554":332059,"555":1117,"556":1417,"557":2306,"558":211171,"559":214171,"560":223061,"561":321035,"562":321036,"563":321037,"564":321038,"565":321039,"566":331004,"567":331005,"568":332060,"569":332061,"570":1215,"571":1216,"572":2705,"573":212151,"574":212161,"575":227051,"576":311209,"577":313010,"578":322033,"579":331006,"580":331007,"581":331721,"582":331807,"583":332062,"584":1418,"585":1711,"586":2605,"587":214181,"588":217111,"589":226051,"590":312045,"591":322034,"592":331008,"593":331009,"594":330013,"595":333030,"596":1712,"597":2105,"598":2504,"599":217121,"600":221051,"601":225041,"602":321041,"603":331010,"604":331011,"605":332063,"606":332064,"607":333031,"608":1317,"609":1516,"610":2208,"611":213171,"612":215161,"613":222081,"614":212032,"615":213062,"616":214012,"617":215032,"618":332065,"619":332066,"620":1217,"621":1612,"622":212171,"623":214022,"624":215012,"625":216042,"626":216121,"627":312046,"628":331012,"629":330014,"630":1517,"631":213172,"632":215171,"633":215172,"634":312047,"635":322035,"636":331013,"637":330015};
const ID2SID = {};
for (const [sid, id] of Object.entries(SHARE)) ID2SID[id] = Number(sid);
const BLOCK = ["1s","2c8","2g1c","4jg","4jk","5l3","64","6four","6iv","6si","89","8jiu","92f","99bb","a55","anal","anus","ass","ash0le","b00b","b1tch","b17ch","ba9","bb1","bbw","bdsm","beaner","bi7ch","bimbos","bitch","boob","boner","c0cks","c0n","c4","cag","ccp","chink","clit","cnm","cnn","cock","coons","cum","cunt","cuum","cv0","darkie","dick","dildo","dilld0","dommes","dpp","dvda","ecchi","erotic","f4k","fag1t","fagg1t","faggot","fck","fdp","fecal","felch","feltch","femdom","flg","fm2","fuck","gay","gcd","gdm","ggc","girlon","goatcx","goatse","gokkun","grope","guro","gwg","hentai","hitler","hjt","honkey","hooker","incest","j8","jba","ji8","jiba","jiz","juggs","jzm","k7","kike","kinky","kmt","kock","liu4","liusi","lolita","lsp","m0m","m2f","mh0","milf","mof0","nambla","negro","nignog","nigga","nigger","nipple","njink","nmd","ntd","ntr","nympho","orgasm","orgy","p0rn","p2np","p3t","paki","panty","pcp","penis","phuq","pig","poof","poon","porn","pqp","prr","pthc","pu55i","pu55y","pubes","puki","punany","pussy","queaf","queef","queer","quim","rape","raping","rapist","rbq","rectum","rimjob","s2x","s3x","sadism","scat","semen","sex","sh7t","shit","shota","six4","skeet","slut","slvt","smut","sodomy","spic","spooge","spunk","suck","t3k","t41","t43","t4e","t4i","tits","tiedup","titty","tmd","tosser","tranny","tushy","twat","twink","vagina","vi4","viiv","vpn","vulva","waf","wank","whore","wh0re","wtf","x3r","xdd","xjp","yaoi","yiffy"];
const esc = (ch) => ch.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
const BLOCK_RE = new RegExp(BLOCK.map((w) => [...w].map(esc).join("[+/]*")).join("|"), "i");

function encodeRaw(arr) {
  if (arr.length !== 33) throw new Error("需要恰好 33 个 share id");
  const padded = [...arr, 0];
  const reordered = [];
  for (let i = 0; i < 17; i++) {
    reordered.push(
      padded[2 * i] >> 4,
      ((padded[2 * i] & 0xf) << 4) + (padded[2 * i + 1] >> 8),
      (arr[2 * i + 1] ?? 0) & 0xff,
    );
  }
  for (let last = 0; last < 0xff; last++) {
    const bytes = [];
    for (let i = 0; i < 25; i++) {
      bytes.push((reordered[i] + last) & 0xff, (reordered[i + 25] + last) & 0xff);
    }
    bytes.push(last);
    const encoded = btoa(String.fromCharCode(...bytes));
    if (!BLOCK_RE.test(encoded)) return encoded;
  }
  throw new Error("找不到可用校验字节");
}

function decodeRaw(src) {
  src = src.trim();
  src = src + "=".repeat((4 - (src.length % 4)) % 4);
  const data = [...atob(src)].map((c) => c.codePointAt(0));
  if (data.length !== 51) throw new Error("牌组码长度不对（应为 51 字节）");
  const last = data.pop();
  const even = [], odd = [];
  for (let i = 0; i < 25; i++) {
    even.push((data[2 * i] - last) & 0xff);
    odd.push((data[2 * i + 1] - last) & 0xff);
  }
  const res = [];
  const flat = [...even, ...odd, 0];
  for (let i = 0; i < 17; i++) {
    res.push((flat[3 * i] << 4) + (flat[3 * i + 1] >> 4));
    res.push(((flat[3 * i + 1] & 0xf) << 8) + flat[3 * i + 2]);
  }
  res.pop();
  return res;
}

function encodeDeck(ids) {
  if (ids.length !== 33) throw new Error(`需要 33 个卡牌 id（3 角色 + 30 行动牌），现在 ${ids.length} 个`);
  const raw = ids.map((id) => {
    if (!(id in ID2SID)) throw new Error(`未知卡牌 id：${id}`);
    return ID2SID[id];
  });
  return encodeRaw(raw);
}

function decodeDeck(code) {
  return decodeRaw(code).map((sid) => {
    if (!(sid in SHARE)) throw new Error(`未知 share id ${sid}`);
    return SHARE[sid];
  });
}

function parseIds(text) {
  return text.split(/[\s,，、]+/).filter(Boolean).map((t) => {
    if (!/^\d+$/.test(t)) throw new Error(`不是数字：${t}`);
    return Number(t);
  });
}

function describe(ids) {
  const chars = ids.slice(0, 3);
  const counts = new Map();
  for (const c of ids.slice(3)) counts.set(c, (counts.get(c) || 0) + 1);
  return {
    code: encodeDeck(ids),
    chars,
    cards: [...counts.entries()].map(([id, n]) => `${id}×${n}`).join(", "),
    ids,
  };
}

const $in = document.getElementById("input");
const $out = document.getElementById("out");
const show = (html) => { $out.innerHTML = html; };
const fail = (e) => show('<span class="err">错误：' + String(e.message || e) + '</span>');
const render = (d) => show(
  '<span class="ok">牌组码：</span><span class="code">' + d.code + '</span>\n' +
  '角色：' + d.chars.join(" ") + '\n' +
  '行动牌：' + d.cards + '\n' +
  '（33 个 id：' + d.ids.join(" ") + '）'
);
function doAuto() {
  try {
    const text = $in.value.trim();
    if (!text) return show("先粘贴牌组码或 33 个 id");
    const looksCode = /^[A-Za-z0-9+/=]{40,}$/.test(text.replace(/\s/g, ""));
    looksCode ? render(describe(decodeDeck(text.replace(/\s/g, "")))) : doEncode();
  } catch (e) { fail(e); }
}
function doEncode() {
  try { render(describe(parseIds($in.value))); } catch (e) { fail(e); }
}
function doDecode() {
  try { render(describe(decodeDeck($in.value.trim()))); } catch (e) { fail(e); }
}
function doSameCard() {
  try {
    const ids = parseIds($in.value);
    if (ids.length < 4) throw new Error("需要 4 个数：行动牌id 角色1 角色2 角色3");
    render(describe([ids[1], ids[2], ids[3], ...Array(30).fill(ids[0])]));
  } catch (e) { fail(e); }
}
function doSameChar() {
  try {
    const ids = parseIds($in.value);
    if (ids.length < 2) throw new Error("需要 2 个数：角色id 行动牌id");
    render(describe([...Array(3).fill(ids[0]), ...Array(30).fill(ids[1])]));
  } catch (e) { fail(e); }
}
function doRepeat() {
  try {
    const ids = parseIds($in.value);
    if (ids.length < 4) throw new Error("需要 3 个角色 + 至少 1 张行动牌");
    const pattern = ids.slice(3);
    const cards = Array.from({ length: 30 }, (_, i) => pattern[i % pattern.length]);
    render(describe([...ids.slice(0, 3), ...cards]));
  } catch (e) { fail(e); }
}
function copyOut() {
  const text = $out.innerText;
  navigator.clipboard?.writeText(text).then(
    () => { $out.dataset.copied = "1"; show('<span class="ok">已复制到剪贴板</span>'); },
    () => show('<span class="err">复制失败，请手动选择</span>')
  );
}
</script>
